; claude-stick: PlatformIO project configuration
; Target hardware: M5StickC Plus 1.1 (ESP32-PICO-D4)

[platformio]
default_envs = m5stick-c-plus
src_dir = src

[env:m5stick-c-plus]
platform = espressif32
board = m5stick-c
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 1500000

; M5Unified handles the M5StickC Plus / Plus2 detection at runtime.
; NimBLE-Arduino and ArduinoJson are pulled now even though the stub
; doesn't use them, so the build environment is ready for the next
; modules to land without re-resolving dependencies.
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_BT_NIMBLE_ENABLED=1
;   -D DEMO_DATA          ; uncomment to inject sample data at boot

build_unflags =
    -std=gnu++11
